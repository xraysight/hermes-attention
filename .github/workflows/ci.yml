name: Tests and local release build

# Only fixed commands and a fixed OS matrix are used; no event payload is interpolated.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Check desktop syntax
        run: npm run check
      - name: Run desktop tests
        run: npm test
      - name: Run backend and packaging tests without live TTS
        run: python -m pytest backend/tests tests -q
      - name: Build the local distribution archive
        run: python scripts/build.py
